services:
  - type: web
    name: outside-bingo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /health
    envVars:
      - key: SERPAPI_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BACKBOARD_LLM_PROVIDER
        value: openrouter
      - key: BACKBOARD_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: BACKBOARD_BASE_URL
        value: https://app.backboard.io/api
      - key: DATABASE_PATH
        value: /tmp/outside_bingo.db